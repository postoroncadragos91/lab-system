<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Căutare pacient</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #526170;
      --line: #d5e0e8;
      --paper: #f3f6f8;
      --card: #ffffff;
      --teal: #0c6b66;
      --teal-dark: #084e4a;
      --mark: #ffe08a;
      --danger: #8d1d1d;
      --danger-bg: #fdecec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, #e7f2f1 0, var(--paper) 220px);
    }

    header {
      padding: 28px 20px 8px;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto 40px;
    }

    h1 {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .cautare {
      margin-top: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(23, 33, 43, 0.05);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 650;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #b7c6d1;
      border-radius: 10px;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      background: #fff;
    }

    input:focus {
      outline: 3px solid rgba(12, 107, 102, 0.25);
      border-color: var(--teal);
    }

    #stare {
      min-height: 1.4em;
      margin: 14px 2px 12px;
      color: var(--muted);
      font-size: 14px;
    }

    #stare.eroare {
      color: var(--danger);
      background: var(--danger-bg);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .lista {
      display: grid;
      gap: 12px;
    }

    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px 6px;
    }

    dl {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 28px;
      margin: 0;
    }

    .camp {
      margin: 0 0 12px;
    }

    .camp.lat {
      grid-column: 1 / -1;
    }

    dt {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    dd {
      margin: 2px 0 0;
      font-size: 16px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    dd.mono {
      font-family: Consolas, "Cascadia Mono", "Segoe UI", monospace;
      letter-spacing: 0.01em;
    }

    mark {
      background: var(--mark);
      color: inherit;
      padding: 0 1px;
      border-radius: 2px;
    }

    @media (max-width: 680px) {
      dl { grid-template-columns: 1fr; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Căutare pacient</h1>
  </header>
  <main>
    <form id="form" class="cautare" role="search" autocomplete="off">
      <label for="q">Căutare</label>
      <input
        id="q"
        name="cautare"
        type="search"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Nume, IDNP, telefon, adresă…"
        autofocus
      />
    </form>
    <p id="stare">Scrieți codul, numele, prenumele, data nașterii, IDNP, sexul, telefonul sau adresa.</p>
    <div id="lista" class="lista" aria-live="polite"></div>
  </main>
  <noscript>Această pagină are nevoie de JavaScript.</noscript>
  <script>
    const CAMPURI = [
      ["cod_pacient", "Cod pacient", true],
      ["nume", "Nume", false],
      ["prenume", "Prenume", false],
      ["data_nasterii", "Data nașterii", false],
      ["idnp", "IDNP", true],
      ["sex", "Sex", false],
      ["telefon", "Telefon", true],
      ["adresa", "Adresă", false]
    ];

    const INSTRUCTIUNE = "Scrieți codul, numele, prenumele, data nașterii, IDNP, sexul, telefonul sau adresa.";
    const FOLD = {
      "ă": "a", "â": "a", "î": "i", "ș": "s", "ş": "s", "ț": "t", "ţ": "t",
      "Ă": "a", "Â": "a", "Î": "i", "Ș": "s", "Ş": "s", "Ț": "t", "Ţ": "t"
    };

    const form = document.getElementById("form");
    const input = document.getElementById("q");
    const stare = document.getElementById("stare");
    const lista = document.getElementById("lista");
    let cerere = 0;
    let timer = 0;

    function fold(value) {
      let out = "";
      for (const ch of value) out += FOLD[ch] || ch;
      return out.toLowerCase();
    }

    function highlight(text, query) {
      const frag = document.createDocumentFragment();
      const fText = fold(text);
      const fQuery = fold(query.trim());
      if (!fQuery) {
        frag.append(document.createTextNode(text));
        return frag;
      }
      let start = 0;
      let idx = fText.indexOf(fQuery);
      if (idx < 0) {
        frag.append(document.createTextNode(text));
        return frag;
      }
      while (idx >= 0) {
        if (idx > start) frag.append(document.createTextNode(text.slice(start, idx)));
        const mark = document.createElement("mark");
        mark.textContent = text.slice(idx, idx + fQuery.length);
        frag.append(mark);
        start = idx + fQuery.length;
        idx = fText.indexOf(fQuery, start);
      }
      if (start < text.length) frag.append(document.createTextNode(text.slice(start)));
      return frag;
    }

    function mesaj(numar, limita) {
      let text;
      if (numar === 1) text = "1 pacient găsit.";
      else text = numar + " pacienți găsiți.";
      if (limita) text += " Sunt afișați primii 100. Continuați să scrieți pentru a restrânge lista.";
      return text;
    }

    function deseneaza(pacienti, query) {
      lista.replaceChildren();
      for (const pacient of pacienti) {
        const card = document.createElement("article");
        const dl = document.createElement("dl");
        for (const [cheie, eticheta, mono] of CAMPURI) {
          const camp = document.createElement("div");
          camp.className = "camp" + (cheie === "adresa" ? " lat" : "");
          const dt = document.createElement("dt");
          dt.textContent = eticheta;
          const dd = document.createElement("dd");
          if (mono) dd.className = "mono";
          dd.append(highlight(pacient[cheie] || "", query));
          camp.append(dt, dd);
          dl.append(camp);
        }
        card.append(dl);
        lista.append(card);
      }
    }

    async function ruleaza() {
      const text = input.value;
      const id = ++cerere;
      if (!text.trim()) {
        lista.replaceChildren();
        stare.textContent = INSTRUCTIUNE;
        stare.className = "";
        return;
      }
      stare.textContent = "Se caută…";
      stare.className = "";
      try {
        const response = await fetch("/api/cautare?q=" + encodeURIComponent(text));
        const data = await response.json();
        if (id !== cerere) return;
        if (!response.ok || data.eroare) {
          lista.replaceChildren();
          stare.textContent = data.eroare || "Nu s-a putut face căutarea.";
          stare.className = "eroare";
          return;
        }
        const pacienti = data.pacienti || [];
        if (pacienti.length === 0) {
          lista.replaceChildren();
          stare.textContent = "Niciun pacient găsit.";
          stare.className = "";
          return;
        }
        stare.textContent = mesaj(pacienti.length, data.limita);
        deseneaza(pacienti, text);
      } catch (err) {
        if (id !== cerere) return;
        lista.replaceChildren();
        stare.textContent = "Nu s-a putut face căutarea. Verificați că aplicația este pornită.";
        stare.className = "eroare";
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      clearTimeout(timer);
      ruleaza();
    });

    input.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(ruleaza, 150);
    });
  </script>
</body>
</html>
